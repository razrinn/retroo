<!doctype html>
<!-- Source for public/og.png (1200x630 social preview). Rebuild: see README "Social preview image". -->
<html>
<head>
<meta charset="utf-8" />
<style>
	html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
	body {
		font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
		color: #2a2723;
		background: #f6f3ec radial-gradient(#e2ddd0 2px, transparent 2px) 0 0 / 32px 32px;
		display: flex; align-items: center; gap: 56px; padding: 0 88px; box-sizing: border-box;
	}
	.copy { flex: 1; }
	h1 { font-size: 132px; letter-spacing: -6px; margin: 0; line-height: 1; display: flex; align-items: center; gap: 24px; }
	p { font-size: 40px; line-height: 1.25; margin: 28px 0 0; color: #4a4640; max-width: 640px; text-wrap: balance; }
	.tag { margin-top: 36px; font-size: 24px; font-weight: 700; color: #534ab7; }
	.notes { position: relative; width: 340px; height: 400px; }
	.note { position: absolute; width: 230px; padding: 22px 24px; border-radius: 6px 6px 26px 6px; font-size: 26px; font-weight: 700; box-shadow: 0 12px 26px -12px rgba(60,45,20,.45); }
	.n1 { background: #d9f5e8; color: #04342c; top: 10px; left: 0; rotate: -6deg; }
	.n2 { background: #ffe3d6; color: #4a1b0c; top: 140px; left: 90px; rotate: 4deg; }
	.n3 { background: #e8e5ff; color: #26215c; top: 270px; left: 20px; rotate: -3deg; }
	.note small { display: block; font-size: 18px; font-weight: 600; opacity: .7; margin-top: 8px; }
</style>
</head>
<body>
	<div class="copy">
		<h1>
			<svg width="130" height="130" viewBox="0 0 120 120"><g transform="rotate(-6 60 60)">
				<path d="M14 10H104a6 6 0 0 1 6 6V84L84 110H20a6 6 0 0 1-6-6Z" fill="#CECBF6" stroke="#534AB7" stroke-width="5" stroke-linejoin="round"/>
				<path d="M110 84H90a6 6 0 0 0-6 6V110Z" fill="#AFA9EC" stroke="#534AB7" stroke-width="5" stroke-linejoin="round"/>
				<circle cx="44" cy="50" r="7" fill="#26215C"/><circle cx="78" cy="50" r="7" fill="#26215C"/>
				<path d="M46 71Q61 84 76 71" fill="none" stroke="#26215C" stroke-width="5" stroke-linecap="round"/>
			</g></svg>
			retroo
		</h1>
		<p>Run your sprint retro together, in real time.</p>
		<div class="tag">Free and open source · Built on Cloudflare</div>
	</div>
	<div class="notes">
		<div class="note n1">Went well<small>Pairing on payments</small></div>
		<div class="note n2">To improve<small>Too many meetings</small></div>
		<div class="note n3">Action items<small>Cap Wednesday meetings</small></div>
	</div>
</body>
</html>
